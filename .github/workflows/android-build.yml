
name: SK Skyline Android Release Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK and Play Store AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # 5. Install Android SDK 36
      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Verify keystore and signing secrets
      - name: Verify Release Keystore
        run: |
          set -e

          test -f "src/release_key.jks" || {
            echo "ERROR: src/release_key.jks not found."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          }

          keytool -list \
            -keystore src/release_key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore verified."

      # 7. Install Node dependencies
      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      # 8. Build Next.js game
      - name: Build Next.js Game
        run: npm run build

      # 9. Verify static export
      - name: Verify Static Game Files
        run: |
          set -e

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html was not generated."
            exit 1
          fi

          echo "Static game export verified."

      # 10. Add Android platform
      - name: Add Android Platform
        run: npx cap add android

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 12. Configure Android SDK versions
      - name: Configure Android SDK Versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/variables.gradle not found."
              )

          content = path.read_text()

          versions = {
              "minSdkVersion": 24,
              "compileSdkVersion": 36,
              "targetSdkVersion": 36
          }

          for key, value in versions.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+"

              content, count = re.subn(
                  pattern,
                  rf"\g<1>{value}",
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Could not configure {key}."
                  )

          path.write_text(content)

          print("Minimum SDK: 24")
          print("Compile SDK: 36")
          print("Target SDK: 36")
          PY

      # 13. Configure landscape orientation
      - name: Set Android Landscape Orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          content = path.read_text()

          pattern = (
              r'<activity\b'
              r'(?=[^>]*android:name="[^"]*MainActivity")'
              r'[^>]*>'
          )

          match = re.search(pattern, content)

          if not match:
              raise SystemExit(
                  "ERROR: MainActivity declaration not found."
              )

          activity = match.group(0)

          if "android:screenOrientation=" in activity:
              activity = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="landscape"',
                  activity
              )
          else:
              activity = (
                  activity[:-1]
                  + ' android:screenOrientation="landscape">'
              )

          content = (
              content[:match.start()]
              + activity
              + content[match.end():]
          )

          path.write_text(content)

          print("Landscape orientation configured.")
          PY

      # 14. Configure release signing safely
      - name: Configure Android Release Signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found."
              )

          content = path.read_text()

          def find_block(text, pattern):
              match = re.search(pattern, text)

              if not match:
                  raise SystemExit(
                      f"ERROR: Gradle block not found: {pattern}"
                  )

              opening = text.find("{", match.start())

              if opening < 0:
                  raise SystemExit(
                      "ERROR: Opening brace not found."
                  )

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = opening

              while i < len(text):
                  char = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if char == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      i += 1
                      continue

                  if char == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue

                  if char == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue

                  if char in ("'", '"'):
                      quote = char
                      i += 1
                      continue

                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1

                      if depth == 0:
                          return opening, i

                  i += 1

              raise SystemExit(
                  "ERROR: Unbalanced braces in Gradle file."
              )

          # Find the Android block.
          android_open, android_close = find_block(
              content,
              r"(?m)^\s*android\s*\{"
          )

          # Add signing configuration inside android.
          if "signingConfigs" not in content:
              signing_config = """
              signingConfigs {
                  release {
                      storeFile rootProject.file("../src/release_key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              """

              content = (
                  content[:android_open + 1]
                  + "\n"
                  + signing_config
                  + content[android_open + 1:]
              )

          # Re-find buildTypes after modifying the file.
          build_open, build_close = find_block(
              content,
              r"\bbuildTypes\s*\{"
          )

          build_types = content[build_open:build_close + 1]

          # Find release block inside buildTypes.
          release_open_relative, release_close_relative = find_block(
              build_types,
              r"\brelease\s*\{"
          )

          release_open = build_open + release_open_relative
          release_close = build_open + release_close_relative

          release_block = content[
              release_open:release_close + 1
          ]

          if "signingConfig" not in release_block:
              insertion = (
                  "\n                    signingConfig signingConfigs.release\n"
              )

              content = (
                  content[:release_open + 1]
                  + insertion
                  + content[release_open + 1:]
              )

          path.write_text(content)

          print("Release signing configured successfully.")
          print("Keystore: src/release_key.jks")
          PY

      # 15. Build signed release APK and AAB
      - name: Build Signed Release APK and AAB
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease \
            bundleRelease

      # 16. Verify signed release APK
      - name: Verify Release APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          apksigner verify --verbose "$APK"

          echo "Signed release APK verified."
          ls -lh "$APK"

      # 17. Verify signed Play Store AAB
      - name: Verify Play Store AAB
        run: |
          set -e

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          jarsigner -verify "$AAB"

          echo "Signed Play Store AAB verified."
          ls -lh "$AAB"

      # 18. Upload release files
      - name: Upload Release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SK-Skyline-Android-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
