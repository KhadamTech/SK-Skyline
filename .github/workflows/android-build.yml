
name: SK Skyline Android Release Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK and Play Store AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # 5. Install Android SDK 36
      - name: Install Android SDK 36
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Verify release keystore
      - name: Verify Release Keystore
        run: |
          set -e

          test -f "src/release_key.jks" || {
            echo "ERROR: src/release_key.jks not found."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          }

          keytool -list \
            -keystore src/release_key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore verified."

      # 7. Install Node dependencies
      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      # 8. Build Next.js game
      - name: Build Next.js Game
        run: npm run build

      # 9. Verify static game files
      - name: Verify Static Game Files
        run: |
          set -e

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html was not generated."
            exit 1
          fi

          echo "Static game export verified."

      # 10. Generate Android project
      - name: Add Android Platform
        run: npx cap add android

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 12. Generate launcher icons ONLY from your JPG
      - name: Generate SK Skyline Launcher Icons
        run: |
          set -e

          SOURCE="src/ic_launcher.jpg"
          RESOURCE_ROOT="android/app/src/main/res"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE was not found."
            exit 1
          fi

          # Install Pillow from Ubuntu packages.
          sudo apt-get update
          sudo apt-get install -y python3-pil

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("src/ic_launcher.jpg")
          resource_root = Path("android/app/src/main/res")

          if not source.is_file():
              raise SystemExit("ERROR: Your launcher JPG is missing.")

          # Read and normalize the exact image supplied by the user.
          with Image.open(source) as original:
              image = ImageOps.exif_transpose(original)
              image = image.convert("RGB")

              if image.width < 256 or image.height < 256:
                  raise SystemExit(
                      "ERROR: Launcher image is too small. "
                      "Use a high-resolution square image, preferably 1024x1024."
                  )

              # Center-crop to a square.
              image = ImageOps.fit(
                  image,
                  (1024, 1024),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5)
              )

          # Android legacy launcher icon density sizes.
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              output_dir = resource_root / folder
              output_dir.mkdir(parents=True, exist_ok=True)

              icon = image.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              # Both launcher references use your supplied image.
              icon.save(
                  output_dir / "ic_launcher.png",
                  format="PNG",
                  optimize=True
              )

              icon.save(
                  output_dir / "ic_launcher_round.png",
                  format="PNG",
                  optimize=True
              )

              print(f"Created {folder}: {size}x{size}")

          # Remove adaptive XML overrides generated by Capacitor.
          # This ensures Android uses the PNGs generated above.
          for xml_file in resource_root.rglob("ic_launcher.xml"):
              if "mipmap-anydpi" in str(xml_file):
                  xml_file.unlink()
                  print(f"Removed default override: {xml_file}")

          for xml_file in resource_root.rglob("ic_launcher_round.xml"):
              if "mipmap-anydpi" in str(xml_file):
                  xml_file.unlink()
                  print(f"Removed default override: {xml_file}")

          # Verify every required icon exists.
          for folder in sizes:
              for filename in (
                  "ic_launcher.png",
                  "ic_launcher_round.png"
              ):
                  path = resource_root / folder / filename

                  if not path.is_file():
                      raise SystemExit(
                          f"ERROR: Missing launcher resource: {path}"
                      )

          print("SUCCESS: All launcher icons use src/ic_launcher.jpg.")
          PY

      # 13. Configure Android SDK versions
      - name: Configure Android SDK Versions
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/variables.gradle not found."
              )

          content = path.read_text()

          versions = {
              "minSdkVersion": 24,
              "compileSdkVersion": 36,
              "targetSdkVersion": 36
          }

          for key, value in versions.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+"

              content, count = re.subn(
                  pattern,
                  rf"\g<1>{value}",
                  content,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Could not configure {key}."
                  )

          path.write_text(content)

          print("Minimum SDK: 24")
          print("Compile SDK: 36")
          print("Target SDK: 36")
          PY

      # 14. Configure manifest and force your launcher icon
      - name: Configure Android Manifest
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found."
              )

          content = path.read_text()

          # Configure MainActivity orientation.
          pattern = (
              r'<activity\b'
              r'(?=[^>]*android:name="[^"]*MainActivity")'
              r'[^>]*>'
          )

          match = re.search(pattern, content)

          if not match:
              raise SystemExit(
                  "ERROR: MainActivity declaration not found."
              )

          activity = match.group(0)

          if "android:screenOrientation=" in activity:
              activity = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="landscape"',
                  activity
              )
          else:
              activity = (
                  activity[:-1]
                  + ' android:screenOrientation="landscape">'
              )

          content = (
              content[:match.start()]
              + activity
              + content[match.end():]
          )

          # Find application declaration.
          application_match = re.search(
              r'<application\b[^>]*>',
              content
          )

          if not application_match:
              raise SystemExit(
                  "ERROR: Application declaration not found."
              )

          application = application_match.group(0)

          # Force both icon references to your generated PNGs.
          icon_attributes = {
              "android:icon": "@mipmap/ic_launcher",
              "android:roundIcon": "@mipmap/ic_launcher_round"
          }

          for attribute, value in icon_attributes.items():
              attr_pattern = (
                  re.escape(attribute) + r'="[^"]*"'
              )

              if re.search(attr_pattern, application):
                  application = re.sub(
                      attr_pattern,
                      f'{attribute}="{value}"',
                      application
                  )
              else:
                  application = (
                      application[:-1]
                      + f' {attribute}="{value}">'
                  )

          content = (
              content[:application_match.start()]
              + application
              + content[application_match.end():]
          )

          path.write_text(content)

          # Verify manifest references.
          if 'android:icon="@mipmap/ic_launcher"' not in content:
              raise SystemExit("ERROR: Main launcher icon not configured.")

          if 'android:roundIcon="@mipmap/ic_launcher_round"' not in content:
              raise SystemExit("ERROR: Round launcher icon not configured.")

          print("Landscape orientation configured.")
          print("Your supplied launcher icon is configured.")
          PY

      # 15. Verify launcher resources and manifest
      - name: Verify Launcher Icon Configuration
        run: |
          set -e

          RES="android/app/src/main/res"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$RES/mipmap-$density/ic_launcher.png"
            test -s "$RES/mipmap-$density/ic_launcher_round.png"
          done

          if find "$RES" -path '*mipmap-anydpi*' \
            \( -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' \) \
            | grep -q .; then
            echo "ERROR: Adaptive launcher icon override still exists."
            exit 1
          fi

          echo "Launcher icon configuration verified."

      # 16. Configure release signing
      - name: Configure Android Release Signing
        working-directory: android
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle not found."
              )

          content = path.read_text()

          def find_block(text, pattern):
              match = re.search(pattern, text)

              if not match:
                  raise SystemExit(
                      f"ERROR: Gradle block not found: {pattern}"
                  )

              opening = text.find("{", match.start())
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = opening

              while i < len(text):
                  char = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if char == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      i += 1
                      continue

                  if char == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue

                  if char == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue

                  if char in ("'", '"'):
                      quote = char
                      i += 1
                      continue

                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1

                      if depth == 0:
                          return opening, i

                  i += 1

              raise SystemExit(
                  "ERROR: Unbalanced Gradle braces."
              )

          # Locate Android block.
          android_open, _ = find_block(
              content,
              r"(?m)^\s*android\s*\{"
          )

          # Add release signing configuration if missing.
          if not re.search(r"\bsigningConfigs\s*\{", content):
              signing_config = """
              signingConfigs {
                  release {
                      storeFile rootProject.file("../src/release_key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              """

              content = (
                  content[:android_open + 1]
                  + "\n"
                  + signing_config
                  + content[android_open + 1:]
              )

          # Locate release build type.
          build_open, build_close = find_block(
              content,
              r"\bbuildTypes\s*\{"
          )

          build_types = content[
              build_open:build_close + 1
          ]

          release_open_relative, release_close_relative = find_block(
              build_types,
              r"\brelease\s*\{"
          )

          release_open = build_open + release_open_relative

          release_block = content[
              release_open:
              build_open + release_close_relative + 1
          ]

          # Attach release signing.
          if not re.search(r"\bsigningConfig\b", release_block):
              content = (
                  content[:release_open + 1]
                  + "\n                    signingConfig signingConfigs.release\n"
                  + content[release_open + 1:]
              )

          path.write_text(content)

          print("Release signing configured.")
          PY

      # 17. Build signed APK and AAB
      - name: Build Signed Release APK and AAB
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease \
            bundleRelease

      # 18. Verify signed release APK and launcher icon
      - name: Verify Release APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "Checking launcher icon inside APK..."

          "$AAPT" dump badging "$APK" | grep -E 'application:|application-icon'

          echo "Signed release APK and launcher metadata verified."
          ls -lh "$APK"

      # 19. Verify signed Play Store AAB
      - name: Verify Play Store AAB
        run: |
          set -e

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          jarsigner -verify "$AAB"

          echo "Signed Play Store AAB verified."
          ls -lh "$AAB"

      # 20. Upload APK and AAB
      - name: Upload Release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SK-Skyline-Android-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
